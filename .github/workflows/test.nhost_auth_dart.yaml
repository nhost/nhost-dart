# This is a template that is used to produce package-specific workflows
#
# The reason we want package-specific workflows at all is so we can
#
# 1. Limit the workflow to only being triggered on changes to files on the
#    package's path, and that of its dependents
# 2. Display a package-specific testing badge (at the time of writing, you can't
#    request badges for matrix configurations)
#
# Instantiations of this template are produced by the Melos postbootstrap script
# which can be found in `melos.yaml`.

name: "nhost_auth_dart tests"
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
# schedule:
# Run the quality job at 4am every day
# - cron: '0 4 * * *'

env:
  MAX_PANA_MISSING_POINTS: 40
jobs:
  # Ensure that the package meets a suitably high pub.dev score
  score-package-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - run: .github/workflows/scripts/make-pana-pubspecs.sh

      # pana needs a newer Dart than the Flutter test-package pins, and pub.dev
      # scores with the latest stable Flutter anyway.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Install pana
        run: dart pub global activate pana 0.23.19

      # Fails when the package misses more than MAX_PANA_MISSING_POINTS points.
      - name: Score package
        run: |
          status=0
          dart pub global run pana --json \
            --exit-code-threshold "${MAX_PANA_MISSING_POINTS:-10}" \
            packages/nhost_auth_dart > "$RUNNER_TEMP/pana.json" || status=$?
          jq -r '
            "## nhost_auth_dart: \(.scores.grantedPoints)/\(.scores.maxPoints) points",
            (.report.sections[] | "", "### \(.title): \(.grantedPoints)/\(.maxPoints)", "", .summary)
          ' "$RUNNER_TEMP/pana.json" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Analyzes, checks formatting, and tests the packages
  test-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/flutter
          key: ${{ runner.OS }}-flutter-install-cache-${{ steps.flutter-version.outputs.version }}

      # Setup the flutter environment
      - name: Setup Dart/Flutter (specific channel)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.3"
          channel: "stable"

      # Get binary dependencies
      - name: Install tools
        run: |
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          dart pub get
          dart pub global activate melos 3.2.0

      - name: Bootstrap packages
        run: melos bootstrap

      # Run analysis on all packages
      - name: Analyze packages
        run: dart run melos analyze

      # Run tests for package in question
      - name: Execute tests
        run: >
          melos exec
          --scope=nhost_auth_dart
          --dir-exists=test --
          'flutter test --no-pub'

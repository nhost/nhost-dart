# Publishes one package to pub.dev, from the `<package>-v<version>` tag it runs
# on (e.g. `nhost_sdk-v5.9.0`). ci_release.yaml dispatches it on the tag of
# every published GitHub release.
#
# Authentication uses pub.dev's OIDC-based automated publishing (no long-lived
# tokens). `dart-lang/setup-dart` below performs the token exchange; the job's
# `id-token: write` permission only makes the exchange possible, it does not
# perform it. pub.dev accepts runs from a `push` of the tag or, opt-in, from a
# `workflow_dispatch` on the tag (dart-lang/pub-dev#7177), but never from a
# `release` event, which is why this workflow is dispatched rather than called
# from ci_release.yaml. For each package this must be enabled once on pub.dev:
#   Admin -> Automated publishing -> Enable publishing from GitHub Actions
#     Repository: nhost/nhost-dart
#     Tag pattern: <package>-v{{version}}   e.g. nhost_sdk-v{{version}}
#     Environment: pub.dev
#     Events: workflow_dispatch enabled, push disabled
# Until that is configured for a package, the publish step for it is rejected
# by pub.dev.
#
# Docs: https://dart.dev/tools/pub/automated-publishing

name: Publish to pub.dev
run-name: Publish ${{ github.ref_name }} to pub.dev

on:
  workflow_dispatch:

# One publish run per tag; never cancel an in-flight publish.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# `shell: bash` runs every step as `bash --noprofile --norc -eo pipefail {0}`.
# GitHub's default is `bash -e {0}`, which has no `pipefail`, so a failing
# command in the middle of a pipeline is masked by the exit status of the last
# one.
defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    # The wait for sibling dependencies alone can take up to an hour.
    timeout-minutes: 90
    # Required by pub.dev's automated-publishing security model. Configure a
    # matching environment named "pub.dev" on each package for extra protection
    # (e.g. required reviewers).
    environment: pub.dev
    permissions:
      contents: read
      id-token: write # OIDC token used to authenticate to pub.dev.

    steps:
      - uses: actions/checkout@v7

      - name: Resolve package and version from tag
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Run this workflow on a <package>-v<version> tag," \
                 "not on $GITHUB_REF" >&2
            exit 1
          fi
          tag="${GITHUB_REF_NAME}"
          name="${tag%-v*}"     # everything before the last "-v"
          version="${tag##*-v}" # everything after the last "-v"
          if [ -z "$name" ] || [ -z "$version" ] || [ "$name" = "$tag" ]; then
            echo "Tag '$tag' is not in <package>-v<version> form" >&2
            exit 1
          fi
          {
            echo "name=$name"
            echo "version=$version"
            echo "dir=packages/$name"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: package=$name version=$version"

      - name: Verify the package exists and is publishable
        env:
          DIR: ${{ steps.tag.outputs.dir }}
          NAME: ${{ steps.tag.outputs.name }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          pubspec="$DIR/pubspec.yaml"
          if [ ! -f "$pubspec" ]; then
            echo "No pubspec at $pubspec for tag package '$NAME'" >&2
            exit 1
          fi
          # These checks are what stands between a bad tag and an irreversible
          # upload, so parse the pubspec as YAML with yq (v4, preinstalled on
          # ubuntu-latest) instead of grepping lines: yq handles quoted scalars
          # (`publish_to: "none"`, `version: "6.0.0"` -- both forms already
          # appear in this repo) and prints `null` for an absent key.
          publish_to="$(yq '.publish_to' "$pubspec")"
          if [ "$publish_to" = "none" ]; then
            echo "$NAME sets publish_to: none; refusing to publish" >&2
            exit 1
          fi
          declared="$(yq '.version' "$pubspec")"
          if [ -z "$declared" ] || [ "$declared" = "null" ]; then
            echo "No top-level version: in $pubspec" >&2
            exit 1
          fi
          if [ "$declared" != "$VERSION" ]; then
            echo "pubspec version ($declared) does not match" \
                 "tag version ($VERSION)" >&2
            exit 1
          fi

      # A version that is already on pub.dev counts as published, so re-running
      # this workflow after a partial failure is always safe.
      - name: Check whether ${{ github.ref_name }} is already on pub.dev
        id: published
        env:
          NAME: ${{ steps.tag.outputs.name }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          status=0
          .github/workflows/scripts/pub-dev-has-version.sh "$NAME" "$VERSION" \
            || status=$?
          case "$status" in
            0)
              echo "$NAME $VERSION is already on pub.dev; nothing to publish"
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            1) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac

      # ci_create_release.yaml creates every release of a release PR at once, so
      # this run can start before the sibling versions this package depends on
      # are on pub.dev. Waiting for them here is what publishes the packages in
      # dependency order. The version to wait for is the sibling's version in
      # this checkout, the one released alongside this package. dev_dependencies
      # count too, because `pub get` in the Validate step resolves them.
      - name: Wait for sibling dependencies to be on pub.dev
        if: steps.published.outputs.exists == 'false'
        env:
          DIR: ${{ steps.tag.outputs.dir }}
          WAIT_MINUTES: 60
        run: |
          declare -A versions
          for pubspec in packages/*/pubspec.yaml; do
            if [ "$(yq '.publish_to' "$pubspec")" = "none" ]; then
              continue
            fi
            versions["$(yq '.name' "$pubspec")"]="$(yq '.version' "$pubspec")"
          done

          deps="$(yq '(.dependencies, .dev_dependencies)
            | select(. != null) | keys | .[]' "$DIR/pubspec.yaml")"

          deadline=$((SECONDS + WAIT_MINUTES * 60))
          for dep in $deps; do
            want="${versions[$dep]:-}"
            if [ -z "$want" ]; then
              continue
            fi
            until .github/workflows/scripts/pub-dev-has-version.sh \
                "$dep" "$want"; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "Gave up after $WAIT_MINUTES minutes waiting for" \
                     "$dep $want to be on pub.dev" >&2
                exit 1
              fi
              echo "Waiting for $dep $want to be on pub.dev"
              sleep 30
            done
            echo "$dep $want is on pub.dev"
          done

      # Provisions the pub.dev credential: exchanges the job's GitHub OIDC
      # id-token for a pub.dev token, exports it as PUB_TOKEN, and registers it
      # with `dart pub token add https://pub.dev --env-var PUB_TOKEN`. Nothing
      # else here does that exchange -- `subosito/flutter-action` only installs
      # the SDK -- so without this step `pub publish` runs unauthenticated. The
      # token entry is written to the per-user Dart config directory
      # (~/.config/dart/pub-tokens.json on Linux) and references PUB_TOKEN, so
      # the Flutter SDK's bundled pub reads the same file even though its `dart`
      # shadows this SDK's on PATH. This mirrors the reference workflow
      # dart-lang/setup-dart/.github/workflows/publish.yml.
      - uses: dart-lang/setup-dart@v1
        if: steps.published.outputs.exists == 'false'

      # Flutter provides the Dart SDK too, so this covers both the pure-Dart and
      # the Flutter packages in the workspace. Pinned to the version the test
      # workflows use.
      - uses: subosito/flutter-action@v2
        if: steps.published.outputs.exists == 'false'
        with:
          flutter-version: "3.27.3"
          channel: stable

      # Publishing is effectively irreversible -- a retracted version keeps its
      # version number forever -- so validate first, in its own step. `--force`
      # below skips the confirmation prompt, not the validation, but it buries
      # the warnings in the log of the step that already uploaded; this keeps
      # them in a clearly labelled step of their own.
      #
      # The checkout restores each package's committed melos
      # `pubspec_overrides.yaml` (`path: ../sibling` for every nhost_* sibling),
      # so `pub get` would resolve siblings from this tree instead of pub.dev.
      # With it in place the dry run passes even when the sibling version this
      # package's constraint needs is not published yet, and the upload is a
      # version nothing can resolve. Dropping the override first makes
      # resolution here match what users and pana see, so a missing sibling
      # version fails `pub get` before anything is uploaded.
      # `git rm` rather than `rm`: pub lists the package's files via git, and a
      # file that is still in the index but gone from disk makes the dry run
      # fail on every release. `--ignore-unmatch` covers nhost_sdk, which has
      # no overrides. `example/pubspec_overrides.yaml` stays: the example is not
      # published, and `flutter pub get` resolves it too, through its own
      # overrides.
      - name: Validate ${{ github.ref_name }}
        if: steps.published.outputs.exists == 'false'
        working-directory: ${{ steps.tag.outputs.dir }}
        run: |
          git rm -q --ignore-unmatch pubspec_overrides.yaml
          flutter pub get
          flutter pub publish --dry-run

      - name: Publish ${{ github.ref_name }}
        if: steps.published.outputs.exists == 'false'
        working-directory: ${{ steps.tag.outputs.dir }}
        run: flutter pub publish --force

      - name: Send Discord notification
        if: always() && steps.published.outputs.exists != 'true'
        continue-on-error: true
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_PRODUCTION }}
          embed-title: "Publish ${{ github.ref_name }} to pub.dev"
          embed-url: >-
            ${{ github.server_url }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}
          embed-description: |
            **Status**: ${{ job.status }}
            **Triggered by**: ${{ github.actor }}

            **Details**:
            - Version: ${{ steps.tag.outputs.version }}
            - Package: ${{ steps.tag.outputs.name }}
          embed-color: ${{ job.status == 'success' && '5763719' || '15548997' }}
